[project]
name = "onboarding-agent"
version = "0.1.0"
description = "Client onboarding agent: identity verification, risk screening and documentation tools"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "fastapi>=0.110",
    "mangum>=0.22.0",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = ["pytest>=8.0", "jsonschema>=4.0", "httpx2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onboarding_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
